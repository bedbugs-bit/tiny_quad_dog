; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.0
    bblanchon/ArduinoJson@^7.0.0
    wire
; Set to 1 to also serve the JSON command protocol over local Wi-Fi
; (POST /command, GET /status) via CommandInterface::beginWifi(), in addition
; to the always-on Serial transport. Leave at 0 for a pure-USB setup that
; needs no Wi-Fi credentials at all.
build_flags =
    -D TQD_ENABLE_WIFI_SERVER=0

; Host-side unit tests for the pure-math kinematics module. No ESP32/Arduino
; framework and no hardware involved -- this is what lets "pio test -e native"
; verify the leg IK/FK is correct on a laptop before anything gets flashed.
; Every other module (gait engine, servo driver, command interface, main)
; depends on Arduino.h/ESP32 libraries, so only leg_kinematics.cpp is built here.
[env:native]
platform = native
test_build_src = yes
build_flags =
    -std=gnu++14
    -Wall
    -Wextra
build_src_filter =
    +<*>
    -<main.cpp>
    -<gait_engine.cpp>
    -<command_interface.cpp>
    -<robot_api.cpp>
    -<servo_driver.cpp>
